[package]
name = "proxmox-sentinel"
version = "0.2.9"
edition = "2024"
description = "Lightweight agentless Proxmox monitoring daemon"

[[bin]]
name = "proxmox-sentinel"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Proxmox API (with TLS, self-signed cert support)
reqwest = { version = "=0.13.2", features = ["json", "rustls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config file (TOML)
toml = "1.1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Prometheus metrics exposition
prometheus = { version = "0.14", features = ["process"] }

# Log file watching (inotify on Linux)
notify = "8"

# SSH for VM log collection
ssh2 = "0.9"

# CLI args
clap = { version = "4", features = ["derive"] }

# Async channels, utilities
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Regex for log parsing
regex = "1"
once_cell = "1"

# HTTP server for /metrics endpoint
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
rust-embed = "8"
mime_guess = "2"

# Persistent storage (embedded SQLite, zero external deps)
rusqlite = { version = "0.39", features = ["bundled"] }
base64 = "0.22"
subtle = "2.6"

# Database collectors
tokio-postgres = "0.7"
redis = { version = "1.2", features = ["tokio-comp"] }

# Crypto utilities
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true         # Strip debug symbols → smaller binary
panic = "abort"      # No unwinding → smaller binary, faster
