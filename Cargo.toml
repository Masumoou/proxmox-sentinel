[package]
name = "proxmox-sentinel"
version = "0.1.0"
edition = "2021"
description = "Lightweight agentless Proxmox monitoring daemon"

[[bin]]
name = "proxmox-sentinel"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Proxmox API (with TLS, self-signed cert support)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config file (TOML)
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Prometheus metrics exposition
prometheus = { version = "0.13", features = ["process"] }

# Log file watching (inotify on Linux)
notify = "6"

# SSH for VM log collection
ssh2 = "0.9"

# CLI args
clap = { version = "4", features = ["derive"] }

# Async channels, utilities
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Regex for log parsing
regex = "1"
once_cell = "1"

# HTTP server for /metrics endpoint
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true         # Strip debug symbols → smaller binary
panic = "abort"      # No unwinding → smaller binary, faster
